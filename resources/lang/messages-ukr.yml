  getDefaultGroup_02: "Ранг за замовчуванням не знайдено."
  getDefaultGroup_03: "Ранг за замовчуванням встановлюється автоматично."
  getGroup_01: "Групу %var0% не знайдено."
  getGroup_02: "Дані групи %var0% некоректні або пошкоджені."
  registerPlayer: "Реєстрація гравця %var0%..."
  setProvider_MySQL: "Provider даних: MySQL."
  setProvider_JSON: "Provider даних: JSON."
  setProvider_SQLITE3: "Provider даних: SQLite3."
  setProvider_NotFound: "Provider %var0% не існує. Використовується стандартний provider."
