---
messages-version: "2.1.0"
language: "ukr"
cmds:
  addrank:
    desc: "Додає новий ранг."
    usage: "Використання: /addrank <ранг>"
    messages:
      rank_added_successfully: "Ранг %var0% успішно додано."
      rank_already_exists: "Ранг %var0% вже існує."
      invalid_rank_name: "Некоректна назва рангу."
  defrank:
    desc: "Встановлює ранг за замовчуванням."
    usage: "Використання: /defrank <ранг> [світ]"
    messages:
      defrank_successfully: "Ранг за замовчуванням встановлено: %var0%."
      rank_not_exist: "Ранг %var0% не існує."
      level_not_exist: "Світ %var0% не існує."
  plperms:
    desc: "Показує дозволи вказаного плагіна."
    usage: "Використання: /plperms <плагін> [сторінка]"
    messages:
      no_plugin_perms: "Плагін %var0% не має дозволів."
      plugin_not_exist: "Плагін %var0% не існує."
      plugin_perms_list: "Дозволи плагіна %var0% (сторінка %var1% з %var2%):"
