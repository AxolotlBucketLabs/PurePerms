    desc: "Показує дозволи вказаного плагіна."
    usage: "Використання: /fperms <плагін> [сторінка]"
    messages:
      no_plugin_perms: "Плагін %var0% не має дозволів."
      plugin_not_exist: "Плагін %var0% не існує."
      plugin_perms_list: "Дозволи плагіна %var0% (сторінка %var1% з %var2%):"
  setgperm:
    desc: "Додає дозвіл групі."
    usage: "Використання: /setgperm <група> <дозвіл> [світ]"
    messages:
      group_not_exist: "Група %var0% не існує."
      level_not_exist: "Світ %var0% не існує."
      gperm_added_successfully: "Дозвіл %var0% додано групі."
  unsetgperm:
    desc: "Видаляє дозвіл групи."
    usage: "Використання: /unsetgperm <група> <дозвіл> [світ]"
    messages:
      group_not_exist: "Група %var0% не існує."
      level_not_exist: "Світ %var0% не існує."
      gperm_not_found: "У групи немає дозволу %var0%."
      gperm_removed_successfully: "Дозвіл %var0% видалено з групи."
  ppreload:
    desc: "Перезавантажує дані та повідомлення PurePerms."
    messages:
      successfully_reloaded: "Дані та повідомлення PurePerms успішно перезавантажено."
      failed: "Не вдалося перезавантажити PurePerms. Перевірте журнал сервера."
  ranks:
    desc: "Показує всі ранги."
    messages:
      all_registered_ranks: "Зареєстровані ранги: %var0%"
  ppinfo:
    desc: "Показує інформацію про PurePerms."
    messages:
      ppinfo_console: "Ви використовуєте PurePerms v%var0% від %var1%."
      ppinfo_player: "Цей сервер використовує PurePerms v%var0% від %var1%."
