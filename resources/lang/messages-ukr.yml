      level_not_exist: "Світ %var0% не існує."
      invalid_exp_time: "Термін %var0% некоректний. Використовуйте permanent, 1d2h3m, 2h або 30m."
      on_player_ranks_change: "Ваш ранг змінено на %var0%!"
      setrank_successfully: "Ранг гравця %var0% успішно змінено."
  setuperm:
    desc: "Додає дозвіл гравцю."
    usage: "Використання: /setuperm <гравець> <дозвіл> [світ]"
    messages:
      level_not_exist: "Світ %var0% не існує."
      uperm_added_successfully: "Дозвіл %var0% додано гравцю %var1%."
  unsetuperm:
    desc: "Видаляє дозвіл гравця."
    usage: "Використання: /unsetuperm <гравець> <дозвіл> [світ]"
    messages:
      level_not_exist: "Світ %var0% не існує."
      uperm_removed_successfully: "Дозвіл %var0% видалено у гравця %var1%."
