      ranks_removed_successfully: "Ранг %var0% успішно видалено."
      ranks_not_exist: "Ранг %var0% не існує."
      invalid_ranks_name: "Некоректна назва рангу."
  setrank:
    desc: "Встановлює ранг гравцю."
    usage: "Використання: /setrank <гравець> <ранг> <термін> [світ]"
    messages:
      access_denied_01: "Ви не маєте права призначати ранг %var0%."
      access_denied_02: "Не можна змінити ранг гравця з рангом %var0%."
