---
messages-version: "2.1.0"
language: "vi"
cmds:
  addrank:
    desc: "Thêm một rank mới."
    usage: "Cách dùng: /addrank <rank>"
    messages:
      rank_added_successfully: "Đã thêm %var0% vào danh sách rank."
      rank_already_exists: "Rank %var0% đã tồn tại."
      invalid_rank_name: "Tên rank không hợp lệ."
  defrank:
    desc: "Đặt rank mặc định."
    usage: "Cách dùng: /defrank <rank> [world]"
    messages:
      defrank_successfully: "Đã đặt rank mặc định thành %var0%."
      rank_not_exist: "Rank %var0% không tồn tại."
      level_not_exist: "World %var0% không tồn tại."
  plperms:
    desc: "Hiển thị danh sách permission của một plugin."
    usage: "Cách dùng: /plperms <plugin>"
    messages:
      no_plugin_perms: "Plugin %var0% không có permission nào."
      plugin_not_exist: "Plugin %var0% không tồn tại."
      plugin_perms_list: "Danh sách permission của plugin %var0% (%var1% / %var2%): "
  ranks:
    desc: "Hiển thị danh sách tất cả rank."
    messages:
      all_registered_ranks: "Tất cả rank đã đăng ký: %var0%"
  ppinfo:
    desc: "Hiển thị thông tin PurePerms, bao gồm tác giả và phiên bản."
    messages:
      ppinfo_console: "Bạn đang sử dụng PurePerms v%var0% của %var1%."
      ppinfo_player: "Server này đang sử dụng PurePerms v%var0% của %var1%."
  rmrank:
    desc: "Xóa một rank khỏi danh sách rank."
    usage: "Cách dùng: /rmrank <rank>"
    messages:
      ranks_removed_successfully: "Đã xóa %var0% khỏi danh sách rank."
      ranks_not_exist: "Rank %var0% không tồn tại."
      invalid_ranks_name: "Tên rank không hợp lệ."
  setrank:
    desc: "Đặt rank cho người chơi."
    usage: "Cách dùng: /setrank <player> <rank> <exp_time> [world]"
    messages:
      access_denied_01: "Bạn không có quyền đặt rank của người chơi thành %var0%."
      access_denied_02: "Bạn không có quyền thay đổi rank của người chơi đang có rank %var0%."
      rank_not_exist: "Rank %var0% không tồn tại."
      level_not_exist: "World %var0% không tồn tại."
      on_player_ranks_change: "Rank của bạn đã được đổi thành %var0%!"
      setrank_successfully: "Đã đặt rank %var0% thành công."
  setuperm:
    desc: "Thêm permission cho người chơi."
    usage: "Cách dùng: /setuperm <player> <permission> [world]"
    messages:
      level_not_exist: "World %var0% không tồn tại."
      uperm_added_successfully: "Đã thêm permission %var0% cho %var1%."
  unsetuperm:
    desc: "Xóa permission của người chơi."
    usage: "Cách dùng: /unsetuperm <player> <permission> [world]"
    messages:
      level_not_exist: "World %var0% không tồn tại."
      uperm_removed_successfully: "Đã xóa permission %var0% của %var1%."
logger_messages:
  language_selected: "Đã chọn ngôn ngữ PurePerms là '%var0%'."
  getConfigValue_01: "Không tìm thấy key %var0% trong config.yml."
  getDefaultGroup_01: "Có nhiều hơn một rank mặc định trong file ranks."
  getDefaultGroup_02: "Không tìm thấy rank mặc định trong file ranks."
  getDefaultGroup_03: "Đang tự động đặt rank mặc định."
  getGroup_01: "Không tìm thấy group %var0%."
  getGroup_02: "Group %var0% có dữ liệu không hợp lệ hoặc bị hỏng."
  registerPlayer: "Đang đăng ký người chơi %var0%..."
  setProvider_MySQL: "Provider dữ liệu được đặt thành MySQL."
  setProvider_JSON: "Provider dữ liệu được đặt thành JSON."
  setProvider_SQLITE3: "Provider dữ liệu được đặt thành SQLite3."
  setProvider_NotFound: "Provider %var0% không tồn tại. Đang sử dụng provider mặc định."
  unregisterPlayer: "Đang hủy đăng ký người chơi %var0%..."
  YAMLProvider_InvalidGroupsSettings: "CẤU HÌNH GROUPS.YML KHÔNG HỢP LỆ: Hãy kiểm tra file ranks.yml có bị hỏng hoặc sai cấu trúc không."
